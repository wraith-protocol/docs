name: Localization QA

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Localization QA
        run: node localization-qa.cjs
