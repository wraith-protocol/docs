name: Snippet checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  extract-sdk-version:
    name: Extract SDK version
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract SDK version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@wraith-protocol/sdk']")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected SDK version: $VERSION"

  check-snippets:
    name: Compile docs snippets
    runs-on: ubuntu-latest
    needs: extract-sdk-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download published SDK artifact
        run: |
          echo "Downloading @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}"
          cd /tmp
          npm pack @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}

      - name: Install dependencies with pinned SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm remove @wraith-protocol/sdk
          pnpm add /tmp/wraith-protocol-sdk-${{ needs.extract-sdk-version.outputs.sdk-version }}.tgz

      - name: Record tested SDK version
        run: |
          echo "Testing against SDK version: ${{ needs.extract-sdk-version.outputs.sdk-version }}"

      - name: Check snippets
        run: pnpm run check:snippets

      - name: Check nav coverage
        run: pnpm run check:nav-coverage

      - name: Check contract registry
        run: pnpm run check:contract-registry

  stellar-testnet-snippets:
    name: Stellar snippet testnet validation
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: extract-sdk-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download published SDK artifact
        run: |
          echo "Downloading @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}"
          cd /tmp
          npm pack @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}

      - name: Install dependencies with pinned SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm remove @wraith-protocol/sdk
          pnpm add /tmp/wraith-protocol-sdk-${{ needs.extract-sdk-version.outputs.sdk-version }}.tgz

      - name: Record tested SDK version
        run: |
          echo "Testing against SDK version: ${{ needs.extract-sdk-version.outputs.sdk-version }}"

      - name: Validate Stellar testnet snippets
        run: pnpm run check:stellar-testnet

  playground-smoke:
    name: Playground smoke test
    runs-on: ubuntu-latest
    needs: extract-sdk-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download published SDK artifact
        run: |
          echo "Downloading @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}"
          cd /tmp
          npm pack @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}

      - name: Install dependencies with pinned SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm remove @wraith-protocol/sdk
          pnpm add /tmp/wraith-protocol-sdk-${{ needs.extract-sdk-version.outputs.sdk-version }}.tgz

      - name: Record tested SDK version
        run: |
          echo "Testing against SDK version: ${{ needs.extract-sdk-version.outputs.sdk-version }}"

      - name: Verify playground fixtures are in sync
        run: pnpm run check:playground-fixtures

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run playground smoke tests
        run: pnpm run test:playground
