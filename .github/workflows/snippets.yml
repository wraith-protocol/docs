name: Snippet checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  check-snippets:
    name: Compile docs snippets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check snippets
        run: pnpm run check:snippets

      - name: Check nav coverage
        run: pnpm run check:nav-coverage

  stellar-testnet-snippets:
    if: github.event_name == 'push'
    name: Stellar snippet testnet validation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Stellar testnet snippets
        run: pnpm run check:stellar-testnet
