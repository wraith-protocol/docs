name: Snippet checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  check-snippets:
    name: Compile docs snippets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check snippets
        run: pnpm run check:snippets

      - name: Check nav coverage
        run: pnpm run check:nav-coverage

  # ── Export path verification ────────────────────────────────────────────────
  # Enumerates every import path and named symbol documented in the MDX files,
  # then confirms each one exists in @wraith-protocol/sdk for both ESM and CJS.
  # Fails the PR if docs and package exports diverge.
  check-exports:
    name: Verify documented SDK export paths (ESM + CJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documented export paths
        run: pnpm run check:exports

  stellar-testnet-snippets:
    name: Stellar snippet testnet validation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Stellar testnet snippets
        run: pnpm run check:stellar-testnet

  playground-smoke:
    name: Playground smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify playground fixtures are in sync
        run: pnpm run check:playground-fixtures

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run playground smoke tests
        run: pnpm run test:playground
