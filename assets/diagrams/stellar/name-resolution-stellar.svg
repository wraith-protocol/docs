  <text x="308" y="117" text-anchor="middle" fill="#767575" font-family="JetBrains Mono, monospace" font-size="9">lookup key</text>

  <line x1="378" y1="104" x2="442" y2="104" stroke="#767575" stroke-width="1.5" marker-end="url(#stellar-name-arrow)" />

  <rect x="450" y="62" width="164" height="84" fill="#141414" stroke="#444444" stroke-width="1" />
  <text x="532" y="87" text-anchor="middle" fill="#e6e1e5" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600">WraithNames</text>
  <text x="532" y="107" text-anchor="middle" fill="#767575" font-family="JetBrains Mono, monospace" font-size="10">CDEMB...AFBV</text>
  <text x="532" y="126" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="10">Soroban contract</text>

  <line x1="614" y1="104" x2="678" y2="104" stroke="#767575" stroke-width="1.5" marker-end="url(#stellar-name-arrow)" />

  <rect x="686" y="74" width="106" height="60" fill="#141414" stroke="#22c55e" stroke-width="1.5" />
  <text x="739" y="99" text-anchor="middle" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="11">st:xlm:...</text>
  <text x="739" y="118" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="10">meta-address</text>

  <path d="M 739 134 C 720 178 584 191 476 171" fill="none" stroke="#767575" stroke-width="1" stroke-dasharray="5 4" />
  <text x="410" y="202" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="10">Senders resolve a name to public stealth keys, then generate a fresh StrKey account for the payment.</text>
