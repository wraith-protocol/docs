<svg viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="820" height="250" fill="transparent" />

  <defs>
    <marker id="stellar-name-arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 3.5 L 0 7" fill="#767575" />
    </marker>
  </defs>

  <rect x="28" y="74" width="138" height="60" fill="#141414" stroke="#c6c6c7" stroke-width="1.5" />
  <text x="97" y="99" text-anchor="middle" fill="#c6c6c7" font-family="JetBrains Mono, monospace" font-size="13">alice.wraith</text>
  <text x="97" y="118" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="10">human recipient</text>

  <line x1="166" y1="104" x2="230" y2="104" stroke="#767575" stroke-width="1.5" marker-end="url(#stellar-name-arrow)" />

  <rect x="238" y="74" width="140" height="60" fill="#141414" stroke="#444444" stroke-width="1" stroke-dasharray="4 3" />
