<svg viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="180" fill="transparent" />

  <defs>
    <marker id="arr-n" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7" fill="#767575" />
    </marker>
  </defs>

  <!-- alice.wraith input -->
  <rect x="10" y="30" width="110" height="56" fill="#141414" stroke="#22c55e" stroke-width="1.5" />
  <text x="65" y="54" text-anchor="middle" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="12">alice.wraith</text>
  <text x="65" y="72" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="10">human-readable</text>

  <line x1="120" y1="58" x2="168" y2="58" stroke="#767575" stroke-width="1.5" marker-end="url(#arr-n)" />

  <!-- SHA-256 hash -->
  <rect x="172" y="30" width="120" height="56" fill="#141414" stroke="#444444" stroke-width="1" />
  <text x="232" y="54" text-anchor="middle" fill="#e6e1e5" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="13">SHA-256</text>
  <text x="232" y="72" text-anchor="middle" fill="#767575" font-family="JetBrains Mono, monospace" font-size="10">storage key</text>

  <line x1="292" y1="58" x2="340" y2="58" stroke="#767575" stroke-width="1.5" marker-end="url(#arr-n)" />

  <!-- Soroban Contract Lookup -->
  <rect x="344" y="30" width="140" height="56" fill="#141414" stroke="#c6c6c7" stroke-width="1.5" />
  <text x="414" y="54" text-anchor="middle" fill="#c6c6c7" font-family="JetBrains Mono, monospace" font-size="11">wraith-names</text>
  <text x="414" y="72" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="10">Soroban contract</text>

  <line x1="484" y1="58" x2="532" y2="58" stroke="#767575" stroke-width="1.5" marker-end="url(#arr-n)" />

  <!-- Meta-address result -->
  <rect x="536" y="22" width="174" height="72" fill="#141414" stroke="#22c55e" stroke-width="1.5" />
  <text x="623" y="42" text-anchor="middle" fill="#22c55e" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="12">Meta-Address</text>
  <text x="623" y="60" text-anchor="middle" fill="#c6c6c7" font-family="JetBrains Mono, monospace" font-size="9">st:xlm:</text>
  <text x="623" y="78" text-anchor="middle" fill="#767575" font-family="JetBrains Mono, monospace" font-size="9">{spending + viewing pub keys}</text>

  <!-- Bottom flow -->
  <line x1="623" y1="94" x2="623" y2="120" stroke="#767575" stroke-width="1.5" marker-end="url(#arr-n)" />

  <rect x="483" y="124" width="280" height="36" fill="#141414" stroke="#444444" stroke-width="1" />
  <text x="623" y="147" text-anchor="middle" fill="#c6c6c7" font-family="JetBrains Mono, monospace" font-size="11">decode → generateStealthAddress() → ECDH</text>

  <!-- Bottom label -->
  <text x="65" y="170" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="9">Wraith Name</text>
  <text x="232" y="170" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="9">Hashed on-chain</text>
  <text x="414" y="170" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="9">registry.resolve()</text>
  <text x="623" y="170" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="9">64 bytes → stealth payment</text>
</svg>