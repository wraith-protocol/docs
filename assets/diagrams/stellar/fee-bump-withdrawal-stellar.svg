<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="500" fill="transparent" />

  <defs>
    <marker id="arr-f" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7" fill="#767575" />
    </marker>
  </defs>

  <!-- Stealth Account -->
  <text x="300" y="20" text-anchor="middle" fill="#767575" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.1em">STEALTH ACCOUNT</text>
  <rect x="100" y="30" width="400" height="56" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="4,4" />

  <rect x="150" y="42" width="300" height="32" fill="#141414" stroke="#22c55e" stroke-width="1.5" />
  <text x="300" y="63" text-anchor="middle" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="12">G... stealth address</text>

  <line x1="300" y1="86" x2="300" y2="110" stroke="#767575" stroke-width="1.5" marker-end="url(#arr-f)" />

  <!-- Problem: No XLM -->
  <rect x="140" y="114" width="320" height="40" fill="#141414" stroke="#ee7d77" stroke-width="1.5" />
  <text x="300" y="134" text-anchor="middle" fill="#ee7d77" font-family="Inter, sans-serif" font-size="12">No XLM balance for fees</text>
  <text x="300" y="150" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="9">Stealth account holds only tokens</text>

  <line x1="300" y1="154" x2="300" y2="182" stroke="#767575" stroke-width="1.5" marker-end="url(#arr-f)" />

  <!-- Sponsor Wraps -->
  <text x="300" y="202" text-anchor="middle" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.1em">SPONSOR WRAPS</text>
  <rect x="100" y="212" width="400" height="100" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4" />

  <rect x="130" y="222" width="340" height="32" fill="#141414" stroke="#c6c6c7" stroke-width="1" />
  <text x="300" y="243" text-anchor="middle" fill="#c6c6c7" font-family="Inter, sans-serif" font-size="12">Sponsor wraps outer tx (fee bump)</text>

  <line x1="300" y1="254" x2="300" y2="270" stroke="#767575" stroke-width="1.5" marker-end="url(#arr-f)" />

  <rect x="130" y="274" width="340" height="28" fill="#141414" stroke="#444444" stroke-width="1" />
  <text x="300" y="294" text-anchor="middle" fill="#c6c6c7" font-family="Inter, sans-serif" font-size="12">Sponsor pays network fee in XLM</text>

  <!-- Inner transaction -->
  <line x1="300" y1="312" x2="300" y2="340" stroke="#767575" stroke-width="1.5" marker-end="url(#arr-f)" />

  <text x="300" y="360" text-anchor="middle" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.1em">INNER TRANSACTION</text>
  <rect x="100" y="370" width="400" height="56" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4" />

  <rect x="130" y="380" width="340" height="36" fill="#141414" stroke="#22c55e" stroke-width="1.5" />
  <text x="300" y="400" text-anchor="middle" fill="#22c55e" font-family="Inter, sans-serif" font-weight="600" font-size="12">Inner: withdraw tokens from stealth</text>
  <text x="300" y="416" text-anchor="middle" fill="#c6c6c7" font-family="JetBrains Mono, monospace" font-size="10">signed with stealth_scalar</text>

  <!-- Network submission -->
  <line x1="300" y1="426" x2="300" y2="454" stroke="#767575" stroke-width="1.5" marker-end="url(#arr-f)" />

  <rect x="130" y="458" width="340" height="28" fill="#141414" stroke="#444444" stroke-width="1" />
  <text x="300" y="477" text-anchor="middle" fill="#c6c6c7" font-family="Inter, sans-serif" font-size="12">Submit fee-bump tx to Horizon</text>
</svg>