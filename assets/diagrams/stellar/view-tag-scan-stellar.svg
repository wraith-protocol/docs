<svg viewBox="0 0 600 540" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="540" fill="transparent" />

  <defs>
    <marker id="a3s" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7" fill="#767575" />
    </marker>
  </defs>

  <!-- FETCH Section -->
  <text x="300" y="20" text-anchor="middle" fill="#767575" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.1em">FETCH ANNOUNCEMENTS</text>
  <rect x="100" y="30" width="400" height="56" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="4,4" />

  <rect x="150" y="42" width="300" height="32" fill="#141414" stroke="#444444" stroke-width="1" />
  <text x="300" y="63" text-anchor="middle" fill="#c6c6c7" font-family="Inter, sans-serif" font-size="12">Soroban RPC getEvents</text>

  <line x1="300" y1="86" x2="300" y2="116" stroke="#767575" stroke-width="1.5" marker-end="url(#a3s)" />

  <!-- VIEW TAG FILTER Section -->
  <text x="300" y="136" text-anchor="middle" fill="#767575" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.1em">VIEW TAG FILTER (1 BYTE)</text>
  <rect x="100" y="146" width="400" height="56" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="4,4" />

  <rect x="150" y="158" width="300" height="32" fill="#141414" stroke="#444444" stroke-width="1" />
  <text x="300" y="179" text-anchor="middle" fill="#c6c6c7" font-family="Inter, sans-serif" font-size="12">Check viewTag against stored key</text>

  <!-- Decision diamond -->
  <line x1="300" y1="202" x2="300" y2="232" stroke="#767575" stroke-width="1.5" marker-end="url(#a3s)" />

  <polygon points="300,236 340,276 300,316 260,276" fill="#141414" stroke="#444444" stroke-width="1" />
  <text x="300" y="280" text-anchor="middle" fill="#c6c6c7" font-family="Inter, sans-serif" font-size="11">match?</text>

  <!-- No branch -->
  <line x1="260" y1="276" x2="80" y2="276" stroke="#ee7d77" stroke-width="1.5" marker-end="url(#a3s)" />
  <text x="140" y="268" text-anchor="middle" fill="#ee7d77" font-family="Inter, sans-serif" font-size="11">No (99.61%)</text>
  <rect x="20" y="288" width="120" height="32" fill="#141414" stroke="#444444" stroke-width="1" stroke-dasharray="4,4" />
  <text x="80" y="309" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="11">Skip → next</text>

  <!-- Yes branch -->
  <line x1="340" y1="276" x2="520" y2="276" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a3s)" />
  <text x="460" y="268" text-anchor="middle" fill="#22c55e" font-family="Inter, sans-serif" font-size="11">Yes (0.39%)</text>

  <!-- ECDH Section -->
  <rect x="440" y="286" width="140" height="32" fill="#141414" stroke="#22c55e" stroke-width="1.5" />
  <text x="510" y="309" text-anchor="middle" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="11">X25519 ECDH</text>

  <line x1="510" y1="318" x2="510" y2="348" stroke="#767575" stroke-width="1.5" marker-end="url(#a3s)" />

  <!-- Derive stealth address -->
  <rect x="440" y="352" width="140" height="48" fill="#141414" stroke="#c6c6c7" stroke-width="1" />
  <text x="510" y="371" text-anchor="middle" fill="#c6c6c7" font-family="Inter, sans-serif" font-size="11">Derive stealth</text>
  <text x="510" y="391" text-anchor="middle" fill="#c6c6c7" font-family="JetBrains Mono, monospace" font-size="11">G... address</text>

  <line x1="510" y1="400" x2="510" y2="430" stroke="#767575" stroke-width="1.5" marker-end="url(#a3s)" />

  <!-- Recover + Spend -->
  <rect x="430" y="434" width="160" height="48" fill="#141414" stroke="#22c55e" stroke-width="1.5" />
  <text x="510" y="453" text-anchor="middle" fill="#22c55e" font-family="Inter, sans-serif" font-weight="600" font-size="12">Recover scalar</text>
  <text x="510" y="471" text-anchor="middle" fill="#22c55e" font-family="Inter, sans-serif" font-weight="600" font-size="12">→ sign + submit</text>

  <!-- Center flow back to main -->
  <line x1="300" y1="316" x2="300" y2="400" stroke="#767575" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="300" y1="400" x2="430" y2="458" stroke="#767575" stroke-width="1.5" />

  <!-- Summary -->
  <text x="300" y="520" text-anchor="middle" fill="#767575" font-family="Inter, sans-serif" font-size="10">View tag filter avoids X25519 ECDH for ~255/256 non-matches</text>
</svg>