[package]
name = "wraith-rust-quickstart"
version = "0.1.0"
edition = "2021"
description = "Compiled reference implementation of the Wraith Rust quickstart guide"
publish = false

# ── Feature flags ─────────────────────────────────────────────────────────────
# Network selection: exactly one of testnet / futurenet / mainnet must be active.
# "network" gates the scan + send modules that pull in reqwest/tokio; CI leaves
# this off so the heavy deps and live RPC calls are not required to type-check.
[features]
default   = ["testnet"]
testnet   = []
futurenet = []
mainnet   = []
network   = ["dep:reqwest", "dep:serde_json", "dep:tokio"]

# ── Dependencies ───────────────────────────────────────────────────────────────
[dependencies]
ed25519-dalek    = { version = "2.1.1", features = ["rand_core"] }
x25519-dalek     = { version = "2.0.1", features = ["static_secrets"] }
curve25519-dalek = { version = "4.1.3" }
sha2             = "0.10.8"
rand             = "0.8.5"
hex              = "0.4.3"
stellar-strkey   = "0.0.8"
anyhow           = "1.0.86"

# Optional — only materialise when the "network" feature is enabled.
reqwest    = { version = "0.12.5",  features = ["json"], optional = true }
serde_json = { version = "1.0.117",                      optional = true }
tokio      = { version = "1.38.0",  features = ["full"], optional = true }

[profile.release]
opt-level = 3
