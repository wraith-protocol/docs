[package]
name = "wraith-rust-quickstart"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "=1.0.103"
curve25519-dalek = "=4.1.3"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"
stellar-strkey = "=0.0.13"
stellar-xdr = { version = "=28.0.1", features = ["base64"] }

[dev-dependencies]
hex = "=0.4.3"
serde_json = "=1.0.150"
