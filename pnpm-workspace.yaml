overrides:
  # Lift axios past the SSRF advisory before @stellar/stellar-sdk ships a fix.
  "axios@<1.20.0": ">=1.20.0"
  # Lift follow-redirects past the credential-stripping CVEs
  # (GHSA-q3jh-wrc6-jgq8, GHSA-8r9p-f939-6h3c, GHSA-mrwp-f3q8-3g9p)
  # via @stellar/stellar-sdk > axios.
  "follow-redirects@<1.16.2": ">=1.16.2"
  # Lift toml past the DoS and prototype pollution advisories
  # via @stellar/stellar-sdk.
  "toml@<5.0.1": ">=5.0.1"
  # Lift uuid past the insecure randomness advisory via @solana/web3.js.
  "uuid@<11.1.1": "^11.1.1"

auditConfig:
  ignoreGhsas:
    # stream-json via @solana/web3.js > jayson — patched releases are ESM-only
    # and break jayson's require() of subpaths it doesn't use. See DEPENDENCY-POLICY.md.
    - GHSA-528h-pc64-c93x
    - GHSA-hqr4-qq8f-hg3x
    - GHSA-mjw6-4jj6-33hc

allowBuilds:
  bufferutil: true
  esbuild: true
  utf-8-validate: true
